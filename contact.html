<script>
    const currentPage = window.location.pathname.split('/').pop();
    const navLinks = document.querySelectorAll('.topnav a, .slide-out-menu a');
    navLinks.forEach(link => {
        const linkPage = link.getAttribute('href').split('/').pop();
        if (linkPage === currentPage) {
            link.classList.add('active');
        }
    });
</script>
<script>
    // This function runs every time the user scrolls
    window.onscroll = function() {
        scrollFunction();
    };

    function scrollFunction() {
        // We'll use 50px as our trigger point
        if (document.body.scrollTop > 50 || document.documentElement.scrollTop > 50) {
            // If scrolled more than 50px, add the "scrolled" class to the body
            document.body.classList.add("scrolled");
        } else {
            // If scrolled back to the top, remove the class
            document.body.classList.remove("scrolled");
        }
    }
</script>
